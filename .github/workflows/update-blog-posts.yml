name: Update Blog Posts

# Set permissions at the workflow level
permissions:
  contents: write  # Allows read and write access to the repository contents
  actions: write   # Lets the last step re-enable this workflow

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:      # Allows manual triggering

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Fetch and Update Blog Posts
        env:
          RSS_URL: https://lanfermann.dev/rss.xml
          READ_ME_PATH: README.md
        run: |
          python update_readme.py

      # Both cards are drawn from my own numbers, private repositories included (see stats_card.py).
      - name: Draw Stats Cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python stats_card.py assets

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: '📝 Update latest blog posts and stats'
          file_pattern: README.md assets/*.svg

      # GitHub turns off a scheduled workflow after 60 days without a commit, and a run that finds
      # no new post commits nothing. Enabling the workflow again resets that timer.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-blog-posts.yml/enable"
