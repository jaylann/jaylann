name: Update Blog Posts

# Set permissions at the workflow level
permissions:
  contents: write  # Allows read and write access to the repository contents
  actions: write   # Lets the last step re-enable this workflow

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:      # Allows manual triggering

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Fetch and Update Blog Posts
        env:
          RSS_URL: https://lanfermann.dev/rss.xml
          READ_ME_PATH: README.md
        run: |
          python update_readme.py

      # GitHub's image proxy times out on github-readme-stats, so the README shows copies kept in
      # the repository. A failed or error card keeps yesterday's copy.
      - name: Fetch Stats Cards
        run: |
          fetch() {
            if curl -fsS --max-time 30 -o "$1.tmp" "$2" && ! grep -q 'Something went wrong' "$1.tmp"; then
              mv "$1.tmp" "$1"
            else
              rm -f "$1.tmp"
              echo "::warning::kept the previous $1"
            fi
          }
          mkdir -p assets
          fetch assets/stats.svg 'https://github-readme-stats.vercel.app/api?username=jaylann&show_icons=true&hide_border=true&bg_color=00000000&title_color=6E60D8&icon_color=6E60D8&text_color=8B949E&ring_color=6E60D8'
          fetch assets/top-langs.svg 'https://github-readme-stats.vercel.app/api/top-langs/?username=jaylann&layout=compact&langs_count=6&hide=tex,mdx&hide_border=true&bg_color=00000000&title_color=6E60D8&text_color=8B949E'

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '📝 Update latest blog posts and stats'
          file_pattern: README.md assets/*.svg

      # GitHub turns off a scheduled workflow after 60 days without a commit, and a run that finds
      # no new post commits nothing. Enabling the workflow again resets that timer.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-blog-posts.yml/enable"
